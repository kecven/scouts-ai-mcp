[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scouts-ai-mcp"
version = "0.1.6"
description = "MCP server exposing the SCOUTS-AI web search API as a single web_search tool for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SCOUTS-AI" }]
keywords = ["mcp", "model-context-protocol", "search", "ai-agents", "llm", "scouts-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
scouts-ai-mcp = "scouts_ai_mcp.server:main"

[project.urls]
Homepage = "https://scouts-ai.com/"
Documentation = "https://scouts-ai.com/llms.txt"
Issues = "https://github.com/kecven/scouts-ai-mcp/issues"
Source = "https://github.com/kecven/scouts-ai-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/scouts_ai_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
